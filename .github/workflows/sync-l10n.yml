name: Sync l10n Branch with main

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  sync-l10n:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fast-forward l10n branch to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout l10n
          git merge --ff-only main || git merge -X theirs main -m "chore(i18n): sync l10n branch with main"
          git push origin l10n
